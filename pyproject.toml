[project]
name = "job-search-copilot"
version = "0.1.0"
description = "Job discovery, scoring, tailoring, and tracking copilot with an automated daily digest PDF"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35",
    "requests>=2.31",
    "pandas>=2.0",
    "anthropic>=0.69",
    "python-dotenv>=1.0",
    "pip-system-certs>=4.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobcopilot*"]
